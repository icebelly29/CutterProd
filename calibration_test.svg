<svg width="200" height="150" xmlns="http://www.w3.org/2000/svg">
  <!-- Bounding box to show the edges -->
  <rect x="10" y="10" width="180" height="130" stroke="blue" fill="none" stroke-width="1"/>
  
  <!-- X Axis Arrow (Points Right) -->
  <path d="M 20 120 L 170 120 M 160 110 L 170 120 L 160 130" stroke="black" fill="none" stroke-width="2" data-method="thru_cut"/>

  <!-- Y Axis Arrow (Points Up towards Y=0) -->
  <!-- Note: SVG Y=0 is at the top, so Y axis pointing "Up" physically means pointing to Y=20 in SVG -->
  <path d="M 20 120 L 20 30 M 10 40 L 20 30 L 30 40" stroke="black" fill="none" stroke-width="2" data-method="thru_cut"/>

  <!-- The Letter 'F' to test mirroring -->
  <path d="M 60 40 L 100 40 M 60 40 L 60 100 M 60 70 L 85 70" stroke="red" fill="none" stroke-width="2" data-method="thru_cut"/>

</svg>
