<svg width="150" height="100" xmlns="http://www.w3.org/2000/svg">
  <!-- Bounding box -->
  <rect x="0" y="0" width="150" height="100" stroke="blue" fill="none" stroke-width="1"/>
  
  <!-- Arrow pointing +X (Right on screen) -->
  <line x1="10" y1="50" x2="130" y2="50" stroke="black" stroke-width="2"/>
  <polygon points="130,45 140,50 130,55" fill="black"/>
  <text x="120" y="40" font-family="sans-serif" font-size="16" font-weight="bold">X Axis</text>

  <!-- Arrow pointing +Y (Down on screen) -->
  <line x1="10" y1="10" x2="10" y2="80" stroke="black" stroke-width="2"/>
  <polygon points="5,80 10,90 15,80" fill="black"/>
  <text x="15" y="85" font-family="sans-serif" font-size="16" font-weight="bold">Y Axis</text>

  <!-- Letter F to easily identify mirroring -->
  <path d="M 50 20 L 80 20 M 50 20 L 50 80 M 50 50 L 70 50" stroke="red" fill="none" stroke-width="3"/>
</svg>
